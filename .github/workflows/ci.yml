name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      INDICATOR_FILE_LEARNING: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "./indicator-ai[dev]"
      - run: python -m ruff check indicator-ai/app indicator-ai/tests
      - run: python -m pytest indicator-ai
      - run: docker compose config --quiet
        env:
          MONGODB_URI: mongodb://example.invalid/indicator
          JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
          ADMIN_PASSWORD: ci-admin-password
          CORS_ALLOWED_ORIGINS: https://example.invalid
          PUBLIC_BASE_URL: https://api.example.invalid
          RATE_LIMIT_SECRET: ci-rate-limit-secret
