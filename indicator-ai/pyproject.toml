[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "indicator-ai"
version = "0.1.0"
description = "Evidence-first RAG intelligence service for INDICATOR"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langchain-core>=0.3,<2",
  "langgraph>=0.2,<2",
  "qdrant-client>=1.13,<2",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "redis>=5,<7",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
