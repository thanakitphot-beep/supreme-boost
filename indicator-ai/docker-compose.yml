services:
  api:
    build: .
    env_file: .env
    expose:
      - "8100"
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.13.4
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: indicator
      POSTGRES_USER: indicator
      POSTGRES_PASSWORD: indicator
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  qdrant_data:
  postgres_data:
