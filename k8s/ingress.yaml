apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omega-jarvis-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSockets support
    nginx.ingress.kubernetes.io/websocket-services: "omega-jarvis-service"
spec:
  tls:
  - hosts:
    - api.omega-jarvis.com
    secretName: omega-jarvis-tls
  rules:
  - host: api.omega-jarvis.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: omega-jarvis-service
            port:
              number: 80
