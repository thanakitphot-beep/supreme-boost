apiVersion: batch/v1
kind: Job
metadata:
  name: indicator-mongo-indexes
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: mongo-indexes
        image: your-registry/indicator-web-chat:1.0.0
        command: ["npm", "run", "db:indexes"]
        envFrom:
        - secretRef:
            name: omega-jarvis-secrets
        - configMapRef:
            name: omega-jarvis-config
