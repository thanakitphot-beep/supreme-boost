apiVersion: apps/v1
kind: Deployment
metadata:
  name: omega-jarvis
  labels:
    app: omega-jarvis
spec:
  replicas: 3
  selector:
    matchLabels:
      app: omega-jarvis
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: omega-jarvis
    spec:
      containers:
      - name: omega-jarvis
        image: your-registry/omega-jarvis:3.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: omega-jarvis-secrets
        - configMapRef:
            name: omega-jarvis-config
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /api/v1/livez
            port: 3000
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /api/v1/livez
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/readyz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
