<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Circle Background -->
  <circle cx="256" cy="256" r="256" fill="#0f172a"/>
  
  <!-- Subtle border for depth -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#334155" stroke-width="8"/>
  
  <!-- Glowing aura behind the bolt -->
  <circle cx="256" cy="256" r="100" fill="#22d3ee" opacity="0.5" filter="url(#glow)"/>
  
  <!-- Cyan Lightning Bolt -->
  <path d="M300 64L140 288h128v160l160-224H300V64z" fill="#22d3ee" stroke="#cffafe" stroke-width="10" stroke-linejoin="round"/>
</svg>
