<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - INDICATOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Prompt', sans-serif; overflow: hidden; }
        .hero-glow {
            position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
            width: 80vw; height: 50vh; background: radial-gradient(circle, rgba(6,182,212,0.15) 0%, rgba(15,23,42,0) 70%); z-index: -1;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-white flex items-center justify-center min-h-screen">
    <div class="hero-glow"></div>
    
    <div class="w-full max-w-md mx-4 p-8 glass-card rounded-2xl relative z-10">
        <div class="text-center mb-8">
            <img src="logo.png" alt="Admin Login Logo" class="h-20 w-auto mx-auto" style="mix-blend-mode: screen; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));">
            <p class="text-slate-400 mt-2">เข้าสู่ระบบจัดการหลังบ้าน</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">รหัสผ่าน (Password)</label>
                <div class="relative">
                    <input type="password" id="password" required
                        class="w-full bg-slate-900/50 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition pl-10"
                        placeholder="••••••••">
                    <i class="fa-solid fa-key absolute left-3 top-3.5 text-slate-400"></i>
                </div>
            </div>

            <div id="error-msg" class="text-red-400 text-sm hidden text-center"></div>

            <button type="submit" id="btn-submit"
                class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold rounded-xl hover:scale-105 transition shadow-lg shadow-cyan-500/30">
                เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('admin_token')) {
            window.location.href = '/admin';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const errorMsg = document.getElementById('error-msg');
            const password = document.getElementById('password').value;

            btn.innerText = 'กำลังตรวจสอบ...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch('/api/admin?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: password })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    localStorage.setItem('admin_token', `Bearer ${data.token}`);
                    window.location.href = '/admin';
                } else {
                    errorMsg.innerText = data.error || 'รหัสผ่านไม่ถูกต้อง';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
                errorMsg.classList.remove('hidden');
            }

            btn.innerText = 'เข้าสู่ระบบ';
            btn.disabled = false;
        });
    </script>
</body>
</html>
