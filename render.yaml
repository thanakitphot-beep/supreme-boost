services:
  - type: web
    name: indicator-web-chat
    runtime: node
    region: singapore
    plan: free
    buildCommand: "npm ci --omit=dev && npm run build"
    startCommand: "npm run release:start"
    healthCheckPath: /api/v1/readyz
    autoDeployTrigger: checksPass

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: ENFORCE_STRICT_CORS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://indicator-web-chat.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://indicator-web-chat.onrender.com
      - key: ENABLE_LEGACY_HMAC_AUTH
        value: "false"
      - key: INDICATOR_FILE_LEARNING
        value: "false"
      - key: REQUIRE_TENANT_API_KEY
        value: "true"
      - key: INDICATOR_ALLOW_FIRST_PARTY_DEMO
        value: "false"
      - key: INDICATOR_STRICT_SITE_ORIGIN
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: RATE_LIMIT_SECRET
        generateValue: true

      # ==========================================
      # AI Keys — ตั้งค่าใน Render Dashboard
      # ==========================================
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: KNOWLEDGE_SYNTHESIS_ENABLED
        value: "false"
      - key: COHERE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # AI Architecture
      - key: AI_PRIMARY_PROVIDER
        value: openai
      - key: AI_FALLBACK_PROVIDER
        value: groq
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_NORMAL_MODEL
        value: gpt-5.6-terra
      - key: AI_FALLBACK_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_REQUEST_TIMEOUT_MS
        value: 15000
      - key: AI_TOTAL_TIMEOUT_MS
        value: 22000
      - key: AI_MAX_RETRIES
        value: 2
      - key: AI_CIRCUIT_MAX_FAILURES
        value: 3

      # Cohere Reranker
      - key: COHERE_RERANK_MODEL
        value: rerank-v3.5
      - key: COHERE_RERANK_TOP_N
        value: 5

      # Database
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: indicator_db
      - key: MONGODB_MAX_POOL_SIZE
        value: "10"

      # Auth
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

      # SMTP
      - key: REGISTRATION_MODE
        value: disabled
      - key: HANDOFF_DELIVERY_MODE
        value: contact_only
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # Free preview uses manual approval until provider secrets are configured.
      - key: PAYMENT_MODE
        value: manual
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: SLIPOK_API_KEY
        sync: false
      - key: SLIPOK_BRANCH_ID
        sync: false
      - key: SLIPOK_RECEIVER_ACCOUNT
        sync: false
      - key: SLIPOK_MAX_AGE_SECONDS
        value: "86400"
