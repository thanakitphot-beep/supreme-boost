services:
  - type: web
    name: indicator-web-chat
    runtime: node
    region: singapore
    plan: free
    buildCommand: "npm ci && npm run build"
    startCommand: "node server.js"
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        sync: false
